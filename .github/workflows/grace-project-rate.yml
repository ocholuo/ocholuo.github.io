name: "Grace project - Rate"

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run_project_update_rate:
    name: rate project - update home rate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Print a greeting
        env:
          MY_VAR: Hi there! My name is
          PROJECT_NAME: rate project
        run: |
          echo $MY_VAR $PROJECT_NAME.

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install requests matplotlib numpy -q

      - name: run script
        run: python ./_posts/00CodeNote/project/rate_tracker/rate_tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/00CodeNote/project/rate_tracker/rate_history.csv
          git add _posts/00CodeNote/project/rate_tracker/rate_trend_*.png
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto CI Job - update home rate img"
          git push origin main
