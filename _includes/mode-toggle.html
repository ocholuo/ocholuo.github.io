<!-- Switch the mode between dark and light. -->
<!--
  Site default is dark. A reader can switch with the sidebar button, and the choice is remembered
  in localStorage. Until a reader chooses, the site stays dark, whatever the system prefers.
  The class keeps the public names that other includes rely on: ModeToggle.ID, ModeToggle.DARK_MODE,
  the `data-mode` attribute on <html>, the posted theme-change message, and flipMode().
-->

<script type="text/javascript">
  class ModeToggle {
    static get MODE_KEY() {
      return 'mode';
    }
    static get MODE_ATTR() {
      return 'data-mode';
    }
    static get DARK_MODE() {
      return 'dark';
    }
    static get LIGHT_MODE() {
      return 'light';
    }
    static get DEFAULT_MODE() {
      return 'dark';
    }
    static get ID() {
      return 'mode-toggle';
    }

    constructor() {
      this.memoryMode = null;
      document.documentElement.setAttribute(ModeToggle.MODE_ATTR, this.modeStatus);
    } /* constructor() */

    /* the reader's saved choice: 'dark', 'light', or null when never chosen */
    get mode() {
      try {
        return localStorage.getItem(ModeToggle.MODE_KEY);
      } catch (e) {
        return this.memoryMode;
      }
    }

    get isDarkMode() {
      return this.mode === ModeToggle.DARK_MODE;
    }

    get isLightMode() {
      return this.mode === ModeToggle.LIGHT_MODE;
    }

    get hasMode() {
      return this.mode != null;
    }

    /* get the current mode on screen */
    get modeStatus() {
      if (this.isLightMode) {
        return ModeToggle.LIGHT_MODE;
      }
      if (this.isDarkMode) {
        return ModeToggle.DARK_MODE;
      }
      return ModeToggle.DEFAULT_MODE;
    }

    saveMode(value) {
      document.documentElement.setAttribute(ModeToggle.MODE_ATTR, value);
      this.memoryMode = value;
      try {
        localStorage.setItem(ModeToggle.MODE_KEY, value);
      } catch (e) {
        /* storage is blocked (private mode): the choice applies to this page only */
      }
    }

    setDark() {
      this.saveMode(ModeToggle.DARK_MODE);
    }

    setLight() {
      this.saveMode(ModeToggle.LIGHT_MODE);
    }

    /* forget the saved choice and return to the site default */
    clearMode() {
      this.memoryMode = null;
      document.documentElement.setAttribute(ModeToggle.MODE_ATTR, ModeToggle.DEFAULT_MODE);
      try {
        localStorage.removeItem(ModeToggle.MODE_KEY);
      } catch (e) {
        /* nothing to clear */
      }
    }

    /* Notify another plugins that the theme mode has changed */
    notify() {
      window.postMessage(
        {
          direction: ModeToggle.ID,
          message: this.modeStatus
        },
        '*'
      );
    }

    flipMode() {
      if (this.modeStatus === ModeToggle.DARK_MODE) {
        this.setLight();
      } else {
        this.setDark();
      }

      this.notify();
    } /* flipMode() */
  } /* ModeToggle */

  const modeToggle = new ModeToggle();
</script>
